# cargo-fuzz workspace for rop-finder (ROB-08 / CLAIM-03 / ENG-10).
#
# This package is DELIBERATELY NOT a member of the root workspace: it depends
# on `libfuzzer-sys`, which only builds under a nightly toolchain with the
# sanitizer runtime, and adding it to the root `members` list would make
# `cargo build` on stable fail for everyone. The self-contained `[workspace]`
# stanza at the bottom of this file is what `cargo fuzz init` generates for
# exactly that reason; nothing in the root Cargo.toml needs to change.
#
# The portable smoke harness lives in `smoke/` and is a THIRD workspace (its
# own `[workspace]` stanza) so that it can be built and run on stable Rust on
# any platform, including Windows, where cargo-fuzz cannot run at all. See
# fuzz/README.md.

[package]
name = "rop-finder-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "BSD-2-Clause"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# Package names changed at 1.0.0 (ENG-08): `rf-core` and `rf-cli` were
# already taken on crates.io. The library targets are still `rf_core` and
# `rf_api`, so the fuzz targets' `use` lines are unchanged.
rop-finder-core = { path = "../crates/rf-core" }
rop-finder-api = { path = "../crates/rf-api" }

# Fuzzing is worthless without optimisation, and worthless without the
# `debug_assertions` that turn a silent wrong answer into a crash the fuzzer
# can see. Keep both.
[profile.release]
debug = 1
debug-assertions = true
overflow-checks = true

# ...for OUR code. iced-x86 is exempted, and this is not a convenience.
#
# iced-x86 1.21.0 decoder.rs:1421 computes an instruction's length as
#
#     let instr_len = self.data_ptr as u32 - data_ptr as u32;
#
# where both operands are 64-bit POINTERS truncated to u32. When the decode
# buffer straddles a 4 GiB address boundary -- start at ...FFFF_FFFD, a five
# byte instruction ending at ...0000_0002 -- the truncated subtraction is
# 0x00000002 - 0xFFFFFFFD. Wrapping, that is 5, which is the right answer and
# what every shipped build computes. Checked, it panics.
#
# So this is a false positive of our own making: overflow-checks turns correct
# wrapping code in a dependency into a crash. It is address-layout dependent,
# so ASLR makes it rare and non-deterministic -- CI hit it once in a 60 s run
# and it does not reproduce from the saved artifact. 1.21.0 is the newest
# release, so there is no upgrade that fixes it.
#
# Exempting the one crate keeps overflow checking everywhere it can still find
# a real bug, which is the whole point of the setting. Do not widen this.
[profile.release.package.iced-x86]
overflow-checks = false

# --- loader targets: one per container format (see README "Why four targets") -

[[bin]]
name = "load_elf"
path = "fuzz_targets/load_elf.rs"
test = false
doc = false
bench = false

[[bin]]
name = "load_pe"
path = "fuzz_targets/load_pe.rs"
test = false
doc = false
bench = false

[[bin]]
name = "load_macho"
path = "fuzz_targets/load_macho.rs"
test = false
doc = false
bench = false

[[bin]]
name = "load_universal"
path = "fuzz_targets/load_universal.rs"
test = false
doc = false
bench = false

# --- CLI-level targets ------------------------------------------------------

[[bin]]
name = "cli_info_bytes"
path = "fuzz_targets/cli_info_bytes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cli_scan_bytes"
path = "fuzz_targets/cli_scan_bytes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cli_scan_raw"
path = "fuzz_targets/cli_scan_raw.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
exclude = ["smoke"]
