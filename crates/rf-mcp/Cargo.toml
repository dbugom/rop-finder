[package]
name = "rf-mcp"
description = "MCP server exposing rop-finder gadget scanning (stdio)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rop-finder-mcp"
path = "src/main.rs"

[dependencies]
rf-cli = { path = "../rf-cli" }
rf-core = { path = "../rf-core" }
rf-scan = { path = "../rf-scan" }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
rmcp = { version = "3", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-std", "time"] }
schemars = "1"
sha2 = "0.10"
regex = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
