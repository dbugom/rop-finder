[package]
# Directory `crates/rf-mcp`, library target `rf_mcp`, package
# `rop-finder-mcp`: `cargo install rop-finder-mcp` builds the
# `rop-finder-mcp` executable (see the workspace manifest).
name = "rop-finder-mcp"
description = "MCP (Model Context Protocol) server exposing rop-finder gadget scanning to agent hosts over stdio, with a directory allowlist and hard resource caps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/rop-finder-mcp"
keywords = ["rop", "gadget", "mcp", "exploit", "agent"]
categories = ["command-line-utilities", "development-tools::debugging"]

# As with rop-finder, the library half is an implementation detail of the
# binary (tool handlers, JSON schemas). It is not a published API.
[lib]
name = "rf_mcp"

[[bin]]
name = "rop-finder-mcp"
path = "src/main.rs"

[package.metadata.docs.rs]
all-features = true

[dependencies]
# ENG-08/ECO-10: the shared request/option layer. This used to be
# `rf-cli`, a BINARY crate, which made rf-mcp unpublishable and forced it
# to keep private copies of the option mapping and the cache key.
rop-finder-api.workspace = true
rop-finder-core.workspace = true
rop-finder-scan.workspace = true
rop-finder-classify.workspace = true
# The chain IR's word kinds and gadget table, for build_rop_chain's typed
# response (CRIT-03). Already in the graph through rf-api.
rop-finder-chain.workspace = true
# MCP-04/ROB-04/CLI-01: the same authenticated, bounded cache module the
# CLI uses. One record, one hex decoder, one key schema.
rop-finder-cache.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
rmcp = { version = "3", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-std", "time"] }
schemars = "1"
sha2.workspace = true
# MCP-DESIGN fix #8 part C: the stable gadget id is
# blake3(binary_sha256 || vaddr_le || bytes)[..10].
blake3 = { version = "1", default-features = false, features = ["std"] }
# Cursor encoding (base64url, no padding). Already in the resolved graph
# through rmcp, so this adds an edge rather than a package.
base64 = "0.23"
regex.workspace = true
# MCP-03/PERF-06: every scan runs inside an explicit pool sized by
# --scan-threads, so the server cannot take every core on the operator's
# machine (the measured runaway held 398-400% CPU).
rayon = "1"
# MCP-09: structured logs on stderr — NEVER stdout, which is the JSON-RPC
# transport — plus the JSONL audit log.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
    "env-filter",
    "std",
] }
# The audit log's per-session identifier.
uuid = { version = "1", features = ["v4"] }

# Path confinement (MCP-01). Unix walks the allowlisted directory with
# openat(O_NOFOLLOW) per component; Windows validates the opened HANDLE.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

# MCP-03's exit criterion is a MEASUREMENT — the server process's CPU time
# and RSS, sampled after the client has been told the request timed out.
# `tests/support/mod.rs` does that with `Get-Process` on Windows and
# /proc/<pid>/stat elsewhere, so it needs no dependency at all.
