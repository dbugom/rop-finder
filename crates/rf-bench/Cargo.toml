[package]
# NOT PUBLISHED, and the only member that is not. This crate is a test
# harness: its whole content is criterion benches plus the `probe` binary
# that CI's regression checker drives, it is useless without the repository's
# fixture corpus (which cannot be redistributed — see docs/PUBLISHING.md),
# and nothing outside this workspace could depend on it for anything. Its
# library target is deliberately empty. `publish = false` makes that intent
# explicit, which ECO-10 records as missing: an unpublished crate with no
# `publish` key is indistinguishable from one nobody got round to releasing.
name = "rf-bench"
description = "Criterion benchmark suite for the rop-finder scan engine (CLAIM-02 / PERF-08)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# This crate exists only to host benches. An empty lib keeps `cargo check -p
# rf-bench` meaningful and gives the bench targets something to link against.

[features]
# PERF-10 exit criterion. Swaps a counting `GlobalAlloc` into `bin/probe.rs`
# so `probe alloc` can report allocations-per-gadget around `post_process`.
# Off by default: the counters are two relaxed atomics on every allocation in
# the process, which is exactly the kind of thing that must not be in a
# timing run.
alloc-count = []

[dependencies]
rop-finder-core.workspace = true
rop-finder-scan.workspace = true

[dev-dependencies]
criterion = { workspace = true }
serde_json.workspace = true

[[bench]]
name = "scan_throughput"
harness = false

[[bench]]
name = "dedup"
harness = false

# PERF-03/04/09: the scan phase alone, serial and parallel, so a decode
# regression cannot hide behind post_process in an end-to-end mean and the
# parallel-scaling ratio is recorded per commit.
[[bench]]
name = "decode_phase"
harness = false

[[bench]]
name = "output"
harness = false
