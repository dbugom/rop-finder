# ENG-01 / ENG-11 — the first CI this repository has ever had.
#
# Before this file, `git ls-files` contained no CI descriptor of any kind, so
# nothing enforced fmt, clippy, tests, the declared MSRV, or that the tree even
# compiles on a platform other than the author's. The Windows-specific code
# paths in particular (%LOCALAPPDATA% cache directory, \\?\ verbatim path
# handling in rf-mcp, the whole windows-virtualprotect chain builder) had never
# been executed by an automated build; windows-2022 below is therefore not
# optional, and macos-13 (x86_64) is kept alongside macos-14 (arm64) because
# the two differ in pointer-authentication behaviour and in which capstone
# object files get built.
#
# Third-party actions: none. Only actions/checkout and actions/cache, both
# first-party, referenced by major-version tag. Commit-SHA pinning is the
# stronger supply-chain guarantee and is deliberately deferred rather than
# faked here — see deny.toml for the dependency-graph half of ENG-11.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          set -euo pipefail
          # rust-toolchain.toml pins the channel; `rustup show` materialises it.
          rustup show active-toolchain || rustup toolchain install stable --profile minimal --no-self-update
          rustup component add rustfmt
          cargo --version
          cargo fmt --version

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - macos-14        # arm64
          - macos-13        # x86_64
          - windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install stable --profile minimal --no-self-update
          rustup component add clippy
          rustc --version
          cargo --version
          cargo clippy --version

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Job logs need admin rights to download through the API, so a failure
      # here was invisible to anyone without them. Echo the failing tail back
      # as ::error:: workflow commands: those become check-run annotations,
      # which ARE readable on a public repository. Costs nothing when green.
      - name: cargo test
        shell: bash
        run: |
          set -o pipefail
          if ! cargo test --workspace 2>&1 | tee cargo-test.log; then
            echo "::group::cargo test --workspace (full output)"
            cat cargo-test.log
            echo "::endgroup::"
            grep -E -A6 '^---- .* stdout ----' cargo-test.log | head -60 | while IFS= read -r line; do echo "::error::$line"; done
            grep -E '^test result: FAILED' cargo-test.log | head -10 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

      # Exit criterion for this release: `--version`, `--help`, and both output
      # modes piped into `head` must exit 0 on every platform. All four exited
      # non-zero before v0.1.1 (1 from the clap error mapping, 101 from the
      # unbuffered println! on EPIPE), which is why they are asserted here and
      # not merely assumed to be covered by `cargo test`.
      - name: Smoke-test the CLI (exit codes, both output modes, broken pipe)
        shell: bash
        run: |
          set -euo pipefail
          cargo build --workspace
          if [ "$RUNNER_OS" = "Windows" ]; then
            bin=target/debug/rop-finder.exe
          else
            bin=target/debug/rop-finder
          fi
          fixture=tests/fixtures/elf-Linux-x64
          "$bin" --version
          "$bin" --help > /dev/null
          "$bin" --binary "$fixture" | head -5
          "$bin" --binary "$fixture" --json | head -5

  msrv:
    name: MSRV check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # ENG-07: the declared MSRV used to be a number in a manifest that
      # nothing tested. It is read straight out of Cargo.toml here rather than
      # duplicated into this file, so the two cannot drift apart: if someone
      # edits `rust-version`, this job starts testing the new value on the same
      # commit. As of 2026-09-03 it resolves to 1.88.0.
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          msrv=$(sed -n 's/^rust-version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Cargo.toml | head -1)
          if [ -z "$msrv" ]; then
            echo "::error file=Cargo.toml::no rust-version in [workspace.package]" >&2
            exit 1
          fi
          # rustup toolchain names need major.minor.patch.
          case "$msrv" in
            *.*.*) ;;
            *) msrv="$msrv.0" ;;
          esac
          echo "version=$msrv" >> "$GITHUB_OUTPUT"
          echo "MSRV is $msrv"

      - name: Install MSRV toolchain
        run: rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal --no-self-update

      # The `+toolchain` argument overrides rust-toolchain.toml, which pins the
      # newer tested compiler. That override is the entire point of this job.
      - name: cargo +MSRV check
        run: cargo +${{ steps.msrv.outputs.version }} check --workspace --all-targets --locked

  supply-chain:
    name: cargo-deny and cargo-audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install stable --profile minimal --no-self-update
          cargo --version

      - name: Cache cargo-deny and cargo-audit binaries
        id: audit-tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-audit-tools-v1

      - name: Install cargo-deny and cargo-audit
        if: steps.audit-tools.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cargo install --locked cargo-deny
          cargo install --locked cargo-audit

      # ENG-11: 141 packages, 135 of them third party, 23 with build scripts
      # that run arbitrary code at build time, and capstone-sys bringing 44 MB
      # of vendored C into every non-x86 decode path. The allow-list in
      # deny.toml is derived from the licenses actually present in the graph;
      # see the comments in that file.
      - name: cargo deny
        run: cargo deny check advisories licenses bans sources

      - name: cargo audit
        run: cargo audit

  # ------------------------------------------------------------------------
  # ENG-08/ECO-10 - v1.0.0's packaging exit criterion, as a gate rather than a
  # one-off: `cargo publish --dry-run` must succeed for every crate marked
  # published. It packages, strips the path deps and BUILDS the tarball, so it
  # catches the two failures a normal `cargo build` cannot see - a file that is
  # not in the package (a dependency on something outside the crate directory)
  # and an internal dependency that lost its `version` and so could never
  # resolve for a consumer.
  #
  # IT NEVER UPLOADS. There is no token in this job and no step without
  # --dry-run. The bootstrap config is explained in .cargo/publish-dry-run.toml
  # and in docs/PUBLISHING.md section 7: before the first real publish, a
  # dependent crate cannot resolve its siblings from crates.io because they are
  # not there yet, so the verification build is pointed at the local paths.
  # After the first release this job keeps working with or without it.
  # ------------------------------------------------------------------------
  package:
    name: cargo publish --dry-run (ENG-08)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install stable --profile minimal --no-self-update
          cargo --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: package-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: package-${{ runner.os }}-cargo-

      # Dependency order, exactly as docs/PUBLISHING.md section 6 lists it.
      - name: Dry-run every published crate
        run: |
          set -euo pipefail
          for p in rop-finder-core rop-finder-scan rop-finder-classify rop-finder-chain rop-finder-cache rop-finder-api rop-finder rop-finder-mcp; do
            echo "=== $p"
            cargo publish --dry-run -p "$p" --config .cargo/publish-dry-run.toml
          done

      # rf-bench is publish = false on purpose (a bench harness that cannot run
      # without the fixture corpus). If someone deletes that key, this fails and
      # says why, instead of the crate quietly becoming publishable.
      - name: rf-bench stays unpublished
        run: |
          set -euo pipefail
          if cargo publish --dry-run -p rf-bench --config .cargo/publish-dry-run.toml; then
            echo "::error::rf-bench is meant to be publish = false - see docs/PUBLISHING.md section 1" >&2
            exit 1
          fi
          echo "rf-bench refused, as intended"

  # ------------------------------------------------------------------------
  # CLAIM-04 - PLAN section 9 defines four "continuous" gates (parity harness,
  # criterion suite frozen in CI, cargo-fuzz "no panic, structured error",
  # property/schema tests). Before this block none of them ran anywhere: the
  # parity number in the README was a point-in-time measurement with no
  # mechanism keeping it true. Everything below is a REQUIRED job, and each one
  # has a recorded red-run in docs/gate-mutation.md proving it can fail.
  # ------------------------------------------------------------------------

  parity:
    name: parity gate (ENG-04)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install stable --profile minimal --no-self-update
          cargo --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: parity-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: parity-${{ runner.os }}-cargo-

      # The oracle is pinned to a commit, not a tag or a range: ROPgadget's
      # gadget set changes between releases, and the committed
      # tests/parity-baseline/*.json reference digests were frozen against this
      # exact one. A different commit here surfaces as ORACLE-DRIFT rather than
      # as a rop-finder regression. capstone is pinned to 5.0.7, the same
      # generation rf-scan links via capstone = "=0.13.0".
      - name: Check out the ROPgadget oracle (pinned)
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/JonathanSalwan/ROPgadget "$RUNNER_TEMP/ropgadget"
          git -C "$RUNNER_TEMP/ropgadget" checkout b6e3fe31af46

      - name: Build the oracle venv (capstone 5.0.7)
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv-oracle"
          "$RUNNER_TEMP/venv-oracle/bin/pip" install --disable-pip-version-check capstone==5.0.7

      - name: cargo build --release -p rop-finder
        run: cargo build --release -p rop-finder

      # The oracle is not bit-identical across platforms: python-capstone ships
      # a prebuilt libcapstone per wheel, and the macOS and Windows reference
      # totals already differ by 514 gadgets over the 24-fixture corpus (see
      # docs/measured-2026-09.md). The committed tests/parity-baseline/ was
      # frozen on Windows, so gating this Linux runner against it directly would
      # charge a wheel difference to rop-finder. This runner therefore freezes
      # its OWN baseline once from the oracle, caches it, and gates every later
      # run against that - the same shape as the criterion job below.
      - name: Restore the CI parity baseline
        id: paritycache
        uses: actions/cache@v4
        with:
          path: ci-parity-baseline
          key: parity-baseline-${{ runner.os }}-${{ runner.arch }}-rg-b6e3fe31af46-cs5.0.7-v1

      - name: Freeze the CI parity baseline (first run on this runner image)
        if: steps.paritycache.outputs.cache-hit != 'true'
        env:
          ROPGADGET_PATH: ${{ runner.temp }}/ropgadget/ROPgadget.py
          ROPGADGET_PYTHON: ${{ runner.temp }}/venv-oracle/bin/python
          RF_NO_BUILD: '1'
        run: |
          set -euo pipefail
          # --seed-reference takes the reference set from the ORACLE, never from
          # rop-finder output; --update-floor then records the ratchet.
          python3 tests/parity.py --seed-reference --baseline-dir ci-parity-baseline
          python3 tests/parity.py --release --top 0 --update-floor --baseline-dir ci-parity-baseline

      # THE GATE. Exits non-zero when any fixture's matched-gadget count falls
      # below its floor, when gadgets the oracle does not have appear beyond the
      # recorded allowance, or when the oracle itself stops producing the frozen
      # reference set (ORACLE DRIFT).
      - name: tests/parity.py (gate)
        env:
          ROPGADGET_PATH: ${{ runner.temp }}/ropgadget/ROPgadget.py
          ROPGADGET_PYTHON: ${{ runner.temp }}/venv-oracle/bin/python
          RF_NO_BUILD: '1'
        run: python3 tests/parity.py --release --top 5 --baseline-dir ci-parity-baseline

      # Reported, never fatal: this is the Windows-frozen baseline, so its
      # ORACLE DRIFT lines are the cross-platform wheel difference, not a
      # regression. It is run anyway so the delta stays visible in the log.
      - name: Report against the committed (Windows) baseline
        if: always()
        env:
          ROPGADGET_PATH: ${{ runner.temp }}/ropgadget/ROPgadget.py
          ROPGADGET_PYTHON: ${{ runner.temp }}/venv-oracle/bin/python
          RF_NO_BUILD: '1'
        run: python3 tests/parity.py --release --top 0 --allow-oracle-drift || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-parity-baseline
          path: ci-parity-baseline

      - name: tests/chain_parity.py
        env:
          ROPGADGET_PATH: ${{ runner.temp }}/ropgadget/ROPgadget.py
          ROPGADGET_PYTHON: ${{ runner.temp }}/venv-oracle/bin/python
          RF_NO_BUILD: '1'
        run: python3 tests/chain_parity.py --release

      # CLAIM-08: the harnesses that used to hardcode rop-finder.exe are
      # exercised here on Linux, the platform they could not run on at all
      # before this release.
      - name: tests/analyze_diff.py (CLAIM-08 platform check)
        env:
          ROPGADGET_PATH: ${{ runner.temp }}/ropgadget/ROPgadget.py
          ROPGADGET_PYTHON: ${{ runner.temp }}/venv-oracle/bin/python
          RF_NO_BUILD: '1'
        run: python3 tests/analyze_diff.py elf-Linux-x86

      - name: tests/benchmark.py (CLAIM-08 platform check)
        env:
          ROPGADGET_PATH: ${{ runner.temp }}/ropgadget/ROPgadget.py
          ROPGADGET_PYTHON: ${{ runner.temp }}/venv-oracle/bin/python
          RF_NO_BUILD: '1'
        run: python3 tests/benchmark.py --runs 1 --case elf-Linux-x86 --no-ropper

      - name: tests/spike_inventory.py (CLAIM-08 platform check)
        env:
          RF_NO_BUILD: '1'
        # --no-write: this step proves the harness RUNS on a non-Windows host
        # (it could not before v0.2.0). tests/spike-report.md is a generated
        # artifact whose numbers move with the engine; regenerating it is a
        # deliberate act, not a CI side effect.
        run: python3 tests/spike_inventory.py --release --no-write

  doc-claims:
    name: doc-claims gate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install stable --profile minimal --no-self-update

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: docclaims-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: docclaims-${{ runner.os }}-cargo-

      - name: Check out the ROPgadget oracle (pinned)
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/JonathanSalwan/ROPgadget "$RUNNER_TEMP/ropgadget"
          git -C "$RUNNER_TEMP/ropgadget" checkout b6e3fe31af46
          python3 -m venv "$RUNNER_TEMP/venv-oracle"
          "$RUNNER_TEMP/venv-oracle/bin/pip" install --disable-pip-version-check capstone==5.0.7

      - name: cargo build --release -p rop-finder
        run: cargo build --release -p rop-finder

      # Extracts every quantitative claim from README/MANUAL/PLAN and resolves
      # it against live measurement or the committed parity baseline, so the
      # v0.1.1 retractions (the >=10x headline, the unsourced ropper figure,
      # the 25-fixture corpus) cannot silently drift back in. Wall-clock timing
      # is skipped: a shared runner measures the runner, not the tool.
      - name: tests/doc_claims.py
        env:
          ROPGADGET_PATH: ${{ runner.temp }}/ropgadget/ROPgadget.py
          ROPGADGET_PYTHON: ${{ runner.temp }}/venv-oracle/bin/python
          RF_NO_BUILD: '1'
        shell: bash
        run: |
          set -o pipefail
          if ! python3 tests/doc_claims.py --no-timing --json doc-claims.json 2>&1 | tee doc-claims.log; then
            echo "::group::doc_claims.py (full output)"
            cat doc-claims.log
            echo "::endgroup::"
            tail -40 doc-claims.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doc-claims
          path: doc-claims.json

  # ------------------------------------------------------------------------
  # ECO-02 - "the CLI is behind its own MCP server". v0.3 closed that finding
  # by hand, which fixed it once; Phase 4 then had two agents implement the
  # same query surface on the two front ends in the same week, against an
  # agreed vocabulary, and still ship `--reads-reg rax` and
  # `reads_reg: "rax"` returning 2888 and 2147 gadgets for the same question.
  # This job is the structural version: it enumerates both surfaces from the
  # tools themselves (clap's --help, and the server's own tools/list), maps
  # them through a declared table that must carry a REASON for every
  # asymmetry, and then asks both surfaces the same 31 questions and compares
  # the gadget sets. A capability that lands on one side only fails here on
  # the commit that adds it.
  # ------------------------------------------------------------------------

  capability-matrix:
    name: CLI <-> MCP capability matrix (ECO-02)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install stable --profile minimal --no-self-update
          cargo --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: capmatrix-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: capmatrix-${{ runner.os }}-cargo-

      # Both front ends, because the gate is that they agree.
      - name: cargo build --release -p rop-finder -p rop-finder-mcp
        run: cargo build --release -p rop-finder -p rop-finder-mcp

      # No ROPgadget oracle: this gate compares rop-finder against itself.
      - name: tests/capability_matrix.py
        env:
          RF_NO_BUILD: '1'
        run: python3 tests/capability_matrix.py

  # ------------------------------------------------------------------------
  # CLI-12 - the flag-conformance matrix. Derives the flag list from the
  # oracle's own args.py and compares stdout byte for byte, so a flag that
  # exists but behaves differently fails exactly as a missing one does.
  # Divergences are declared in the harness with a finding ID and a bound;
  # one that stops happening is reported as STALE.
  # ------------------------------------------------------------------------

  flag-conformance:
    name: ROPgadget flag conformance (CLI-12)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install stable --profile minimal --no-self-update
          cargo --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: flagconf-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: flagconf-${{ runner.os }}-cargo-

      - name: Check out the ROPgadget oracle (pinned)
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/JonathanSalwan/ROPgadget "$RUNNER_TEMP/ropgadget"
          git -C "$RUNNER_TEMP/ropgadget" checkout b6e3fe31af46
          python3 -m venv "$RUNNER_TEMP/venv-oracle"
          "$RUNNER_TEMP/venv-oracle/bin/pip" install --disable-pip-version-check capstone==5.0.7

      - name: cargo build --release -p rop-finder
        run: cargo build --release -p rop-finder

      - name: tests/flag_conformance.py
        env:
          ROPGADGET_PATH: ${{ runner.temp }}/ropgadget/ROPgadget.py
          ROPGADGET_PYTHON: ${{ runner.temp }}/venv-oracle/bin/python
          RF_NO_BUILD: '1'
        run: python3 tests/flag_conformance.py

  bench:
    name: criterion regression band (CLAIM-02 / PERF-08)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install stable --profile minimal --no-self-update

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: bench-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: bench-${{ runner.os }}-cargo-

      # Compiles and runs every bench once. This alone is a gate: benches/ was
      # an empty directory with no criterion dependency, so a bench that
      # stopped compiling against the engine API was previously impossible to
      # notice.
      - name: cargo bench -p rf-bench -- --test
        run: cargo bench -p rf-bench -- --test

      - name: Restore the CI bench baseline
        id: benchcache
        uses: actions/cache@v4
        with:
          path: ci-bench-baseline.json
          key: bench-baseline-${{ runner.os }}-${{ runner.arch }}-v1

      - name: cargo bench -p rf-bench
        run: cargo bench -p rf-bench

      # The committed baseline was recorded on a developer machine, so a
      # cross-environment comparison would be noise. The gate compares against
      # a baseline this runner recorded for itself and cached; the band is the
      # >10% figure REMEDIATION names.
      - name: Record the CI baseline (first run on this runner image)
        if: steps.benchcache.outputs.cache-hit != 'true'
        run: python3 crates/rf-bench/check_regression.py --record --baseline ci-bench-baseline.json

      - name: Regression check against the CI baseline (>10% fails)
        run: |
          set -euo pipefail
          python3 crates/rf-bench/check_regression.py --baseline ci-bench-baseline.json --band 0.10 --cross-environment

      # Reported, never fatal: the committed baseline is a developer machine's.
      - name: Report against the committed baseline
        if: always()
        run: python3 crates/rf-bench/check_regression.py --band 0.10 || true

  fuzz:
    name: cargo-fuzz smoke (60 s per target)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # ROB-08/CLAIM-03/ENG-10: fuzz/ is created by the hostile-input
      # workstream. This job is guarded on the directory existing so it is
      # green-and-skipped until that lands, and becomes a real gate the moment
      # it does, rather than being a job somebody has to remember to add later.
      - name: Is there a fuzz/ directory?
        id: has-fuzz
        run: |
          set -euo pipefail
          if [ -d fuzz ] && [ -f fuzz/Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "no fuzz/Cargo.toml in this tree - nothing to run"
          fi

      - name: Install nightly and cargo-fuzz
        if: steps.has-fuzz.outputs.present == 'true'
        run: |
          set -euo pipefail
          rustup toolchain install nightly --profile minimal --no-self-update
          cargo install --locked cargo-fuzz

      - name: Run every fuzz target for 60 s
        if: steps.has-fuzz.outputs.present == 'true'
        run: |
          set -euo pipefail
          targets=$(cargo +nightly fuzz list)
          if [ -z "$targets" ]; then
            echo "::error::fuzz/ exists but declares no targets" >&2
            exit 1
          fi
          for t in $targets; do
            echo "=== $t"
            cargo +nightly fuzz run "$t" -- -max_total_time=60
          done

      - uses: actions/upload-artifact@v4
        if: failure() && steps.has-fuzz.outputs.present == 'true'
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
