# cargo-deny configuration — ENG-11.
#
# Run locally exactly as CI runs it:
#
#     cargo install --locked cargo-deny
#     cargo deny check advisories licenses bans sources
#
# Validated against cargo-deny 0.20.2.
#
# SCOPE. This file governs the Rust dependency graph only — 141 packages when
# ENG-11 was filed, of which 135 are third party. It says nothing about
# the 24 third-party binaries under tests/fixtures/: those are redistributed
# test data, not linked code, they are carved out of this repository's blanket
# BSD-2-Clause declaration one by one in tests/fixtures/PROVENANCE.md, and
# cargo-deny never looks at them. A license question about a fixture is
# answered by PROVENANCE.md, not by this file.

[graph]
# Every target we build for in .github/workflows/release.yml, plus the two
# linux-gnu hosts CI itself runs on. Restricting the target set keeps
# cfg-gated dependencies that we never build (wasi, r-efi, redox) out of the
# license and advisory verdicts.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]
all-features = true

[advisories]
# RUSTSEC database, fetched by cargo-deny itself. Nothing is ignored: an
# advisory against any of the 135 third-party packages fails the build. When
# an ignore does become necessary it goes here with a RUSTSEC id, a date and
# a sentence saying why the code path is unreachable — never bare.
ignore = []

[licenses]
# Derived, not guessed. Every distinct license expression in the resolved
# graph, obtained with:
#
#   cargo tree --workspace --prefix none --format "{p} {l}" | sort -u
#
# was, on 2026-09-03 (count of packages carrying each expression):
#
#   94  MIT OR Apache-2.0                   the bulk of the graph
#   24  MIT                                 tokio, capstone, capstone-sys,
#                                           goblin, iced-x86, schemars, ...
#    6  Apache-2.0 OR MIT                   same thing, other spelling
#    9  BSD-2-Clause                        the nine workspace crates.
#                                        RE-COUNTED 2026-09-04 with the
#                                        command above, after ENG-08 added
#                                        rf-api and renamed the packages:
#                                        rop-finder, rop-finder-{api,cache,
#                                        chain,classify,core,mcp,scan} and
#                                        rf-bench. The other rows are the
#                                        2026-09-03 inventory and were not
#                                        re-counted; no third-party edge
#                                        changed in this release.
#    3  Unlicense OR MIT                    aho-corasick, globset, memchr
#    3  MIT/Apache-2.0                      ident_case, plain, version_check
#                                           (legacy slash spelling, = OR)
#    3  Apache-2.0 WITH LLVM-exception       rustix, linux-raw-sys, wasi;
#         OR Apache-2.0 OR MIT              satisfied by the MIT branch, so
#                                           the LLVM exception need not be
#                                           allowed
#    2  Apache-2.0                          rmcp, rmcp-macros
#    1  MIT OR Apache-2.0                   r-efi; the LGPL branch is never
#         OR LGPL-2.1-or-later              taken, and r-efi is not built for
#                                           any target in [graph] anyway
#    1  (MIT OR Apache-2.0) AND Unicode-3.0 unicode-ident  <- the AND is the
#                                           only reason Unicode-3.0 has to be
#                                           on the allow list
#
# So the allow list below is exactly the set of licenses required to satisfy
# those expressions and nothing more. Adding a dependency under a license not
# listed here is a deliberate decision that has to be made in this file.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.93
# No per-crate exceptions today. A copyleft dependency would need one here,
# and NOTICE would need to grow a section for it in the same commit.
exceptions = []

[bans]
# Deny is the useful setting: it is what turns "we accidentally carry two
# copies of a crate" into a build failure instead of a line of log nobody
# reads. Known, deliberate duplicates are listed in `skip` with a reason.
multiple-versions = "deny"
# DENY, restored in v1.0.0. This was `warn` from Phase 1 to Phase 5 for one
# reason: the workspace crates depended on each other by
# `{ path = "../rf-core" }` with NO version requirement, which cargo-deny
# counts as a wildcard, and `allow-wildcard-paths` does not apply to a
# publishable crate because crates.io rejects a bare path dependency. With
# `wildcards = "deny"` that run failed with eleven `error[wildcard]`
# diagnostics.
#
# ENG-08 removed the cause rather than the check: every internal dependency
# is now `{ path = "...", version = "1.0.0" }`, declared once in the root
# `[workspace.dependencies]`, so there are no wildcards left to allow. The
# 2026-09-04 run of `cargo deny check advisories licenses bans sources`
# reports "9 checks; 0 errors, 0 warnings" with this setting.
#
# Keep `allow-wildcard-paths` on: it costs nothing now and it is what would
# catch a NEW unversioned path dependency as the narrower error rather than
# as a general wildcard.
wildcards = "deny"
allow-wildcard-paths = true
# Build scripts run arbitrary code at build time; 23 packages in this graph
# have one. `highlight` makes them visible in `cargo deny check bans` output
# rather than silently allowed.
highlight = "all"

skip = [
    # The proc-macro ecosystem is mid-migration from syn 2 to syn 3:
    # clap_derive/serde_derive/thiserror-impl pull one and schemars_derive
    # pulls the other. Both are build-time only and neither ships in the
    # released binary. Remove this entry once the graph converges on syn 3.
    { crate = "syn@2", reason = "syn 2/3 split across proc-macro deps; build-time only" },
    # PRE-EXISTING at the v0.5.0 tag, surfaced here because v1.0.0 is the
    # release that makes `cargo deny check` part of the publish checklist.
    # `cpufeatures` is the 3-file CPU-feature-detection shim RustCrypto uses:
    # sha2 0.10.9 (the newest 0.10) pulls 0.2.17, blake3 1.8.7 pulls 0.3.1.
    # Nothing this workspace declares can reconcile them — sha2 0.11.0 exists
    # and moves to cpufeatures 0.3, but it is a breaking `digest` bump that
    # would change rf-cache's hashing call sites, which is not a v1.0.0
    # packaging change. Both copies are runtime code and both ship in the
    # binary; the cost is a few KB of duplicated `is_x86_feature_detected`
    # plumbing and no security surface. Remove this entry when rf-cache,
    # rop-finder and rop-finder-mcp move to sha2 0.11.
    { crate = "cpufeatures", reason = "sha2 0.10 pulls 0.2, blake3 1.8 pulls 0.3; converges on the sha2 0.11 bump" },
]

deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# crates.io and nothing else. There are no git dependencies in Cargo.lock and
# there must not be: a git dependency is an unpinned, unaudited code source
# for a tool that parses attacker-supplied binaries.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
